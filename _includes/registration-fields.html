<div class="form-group">
  <label for="regName">Your name (first and last names):</label>
  <input type="text" class="form-control text-muted" id="regName"/>
</div>

<div class="form-group">
  <label for="regEmail">Your email address:</label>
  <input type="email" class="form-control text-muted" id="regEmail"/>
</div>

<div class="form-group">
  <label for="regMode1">Main travel mode:</label>
  <select class="form-control text-muted" id="regMode1" name="regMode1">
    <option value="" selected>Select green transport mode</option>
    <option value="car share">Car share</option>
    <option value="electric car">Electric car</option>
    <option value="taxi">Taxi</option>
    <option value="park and ride">Park and ride</option>
    <option value="tram">Tram</option>
    <option value="bus">Bus</option>
    <option value="train">Train</option>
    <option value="cycling">Cycling</option>
    <option value="walk">Walk</option>
    <option value="wheeling">Wheeling</option>
    <option value="work from home">Work from home</option>
    <option value="jogging">Jogging</option>
    <option value="running">Running</option>
    <option value="rowing">Rowing</option>
  </select>
</div>

<div class="form-group">
  <label for="regMode2">Previous mode:</label>
  <select class="form-control text-muted" id="regMode2" name="regMode2">
    <option value="" selected>Select previous transport mode</option>
    <option value="small car">Small car</option>
    <option value="medium car">Medium car</option>
    <option value="large car">Large car</option>
    <option value="car share">Car share</option>
    <option value="electric car">Electric car</option>
    <option value="taxi">Taxi</option>
    <option value="park and ride">Park and ride</option>
    <option value="tram">Tram</option>
    <option value="bus">Bus</option>
    <option value="train">Train</option>
    <option value="cycling">Cycling</option>
    <option value="walk">Walk</option>
    <option value="wheeling">Wheeling</option>
    <option value="work from home">Work from home</option>
    <option value="jogging">Jogging</option>
    <option value="running">Running</option>
    <option value="rowing">Rowing</option>
  </select>
</div>

<div class="form-group">
  <label for="regDistance">Default return journey distance (miles):</label>
  <input type="number" step="0.1" min="0" class="form-control text-muted" id="regDistance"/>
</div>
